name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar formatacao, analise estatica e testes
        run: sh ./gradlew spotlessCheck :app:detekt :app:lintDebug :app:testDebugUnitTest --continue
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
